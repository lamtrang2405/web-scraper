services:
  - type: web
    name: web-scraper-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: export downloads are cached in process memory.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 600 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        value: https://lamtrang2405.github.io
